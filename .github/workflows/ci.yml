name: RestoPass CI Security & Quality Gate

on:
  # Validate direct changes to the production branch.
  push:
    branches: [main]
  # Validate feature branches through their pull requests.
  # Do not also run on feature-branch pushes: that duplicates the PR run.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel obsolete runs when a newer commit is pushed to the same PR/branch.
concurrency:
  group: restopass-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restopass
          POSTGRES_PASSWORD: restopass_test_password
          POSTGRES_DB: restopass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restopass -d restopass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://restopass:restopass_test_password@localhost:5432/restopass_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / Lint
        run: npm run lint

      - name: Execute Security & Integrity Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Validate and exercise backup recovery scripts
        run: |
          sh -n deploy/backup.sh
          sh -n deploy/backup-verify.sh
          sh -n deploy/restore.sh
          sh -n deploy/restore-offsite.sh
          sh -n deploy/backup-healthcheck.sh
          sh -n tests/backup-recovery.test.sh
          sh tests/backup-recovery.test.sh

      - name: Build production Docker image
        run: docker build --tag restopass-ci .

      - name: Build production backup image
        run: docker build --file deploy/backup.Dockerfile --tag restopass-backup-ci .
