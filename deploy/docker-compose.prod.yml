# ==============================================================================
# RestoPass Multi-Tenant Campus & Cafeteria Cloud Production Stack
# High-Scale Architecture (50,000 DAU Distributed Deployment)
# ==============================================================================
# Services:
#   1. postgres: Managed Relational Database with strict constraints & append-only ledger
#   2. redis: Distributed In-Memory Cache for 30s atomic QR token replay prevention
#   3. app: Hardened Node.js Authority & SPA Application
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Primary PostgreSQL 16 Relational Persistence
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: restopass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 2. Managed Redis 7 In-Memory Cache (Multi-Instance QR Replay Guard)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: restopass-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 3. RestoPass Cloud Application Node
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: restopass-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      RESTOPASS_SUPERADMIN_PASSWORD: ${RESTOPASS_SUPERADMIN_PASSWORD:?RESTOPASS_SUPERADMIN_PASSWORD is required}
      PORT: 3000
      # Relational persistence connection
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      PGSSLMODE: disable
      # Distributed Redis cache
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # Production Secrets (Mandatory >= 32 chars)
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      RESTOPASS_MASTER_SECRET: ${RESTOPASS_MASTER_SECRET:?RESTOPASS_MASTER_SECRET is required}
      # S3 / DigitalOcean Spaces / Cloudflare R2 Object Storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL_PREFIX: ${S3_PUBLIC_URL_PREFIX:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - app_uploads:/app/public/uploads
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: restopass-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local

