# ==============================================================================
# RestoPass Multi-Tenant Campus & Cafeteria Cloud Production Stack
# Pilot Baseline Production Architecture (Single-Instance Cloud Deployment)
#
# HARDWARE SIZING & CAPACITY NOTES:
# - PostgreSQL Limit: 2048M | Redis Limit: 1024M | App Limit: 2048M | Backup: 1024M | Caddy: 512M
# - Combined with Caddy reverse proxy and Linux host OS overhead, this complete
#   stack requires a minimum 8 GB RAM VM (e.g. AOS Cloud Standard Option 6).
# - 2 GB RAM (Option 2) and 4 GB RAM (Option 4) will experience OOM kills or severe paging.
# - High-scale throughput (e.g. 50,000 DAU) has not been benchmarked and requires
#   dedicated load testing and multi-instance orchestration before making capacity claims.
# ==============================================================================
# Services:
#   1. postgres: Managed Relational Database with strict constraints & append-only ledger
#   2. redis: Distributed In-Memory Cache for 30s atomic QR token replay prevention
#   3. app: Hardened Node.js Authority & SPA Application
#   4. backup: Automated encrypted pg_dump + HMAC + S3 off-site backup worker
#   5. caddy: TLS terminator, reverse proxy, HSTS, rate-limiting & security headers
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Primary PostgreSQL 16 Relational Persistence
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: restopass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 2. Managed Redis 7 In-Memory Cache (Multi-Instance QR Replay Guard)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: restopass-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 3. RestoPass Cloud Application Node
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: restopass-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      RESTOPASS_SUPERADMIN_PASSWORD: ${RESTOPASS_SUPERADMIN_PASSWORD:?RESTOPASS_SUPERADMIN_PASSWORD is required}
      PORT: 3000
      # Relational persistence connection
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      PGSSLMODE: disable
      # Distributed Redis cache
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # Production Secrets (Mandatory >= 32 chars)
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      RESTOPASS_MASTER_SECRET: ${RESTOPASS_MASTER_SECRET:?RESTOPASS_MASTER_SECRET is required}
      # S3 / DigitalOcean Spaces / Cloudflare R2 Object Storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL_PREFIX: ${S3_PUBLIC_URL_PREFIX:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - app_uploads:/app/public/uploads
    networks:
      - backend

  # ----------------------------------------------------------------------------
  # 4. Automated Encrypted Backup & Off-Site Sync Worker
  # ----------------------------------------------------------------------------
  backup:
    build:
      context: ..
      dockerfile: deploy/backup.Dockerfile
    container_name: restopass-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "restopass-backup-healthcheck"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 5m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-restopass}
      PGUSER: ${POSTGRES_USER:-restopass}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RESTOPASS_BACKUP_ENCRYPTION_KEY: ${RESTOPASS_BACKUP_ENCRYPTION_KEY:?RESTOPASS_BACKUP_ENCRYPTION_KEY is required}
      RESTOPASS_BACKUP_HMAC_KEY: ${RESTOPASS_BACKUP_HMAC_KEY:?RESTOPASS_BACKUP_HMAC_KEY is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      RESTOPASS_BACKUP_REQUIRE_OFFSITE: ${RESTOPASS_BACKUP_REQUIRE_OFFSITE:-true}
      RESTOPASS_BACKUP_S3_BUCKET: ${RESTOPASS_BACKUP_S3_BUCKET:-}
      RESTOPASS_BACKUP_S3_PREFIX: ${RESTOPASS_BACKUP_S3_PREFIX:-restopass}
      RESTOPASS_BACKUP_S3_REGION: ${RESTOPASS_BACKUP_S3_REGION:-us-east-1}
      RESTOPASS_BACKUP_S3_ENDPOINT: ${RESTOPASS_BACKUP_S3_ENDPOINT:-}
      RESTOPASS_BACKUP_S3_ACCESS_KEY_ID: ${RESTOPASS_BACKUP_S3_ACCESS_KEY_ID:-}
      RESTOPASS_BACKUP_S3_SECRET_ACCESS_KEY: ${RESTOPASS_BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ${RESTOPASS_BACKUP_DIR:-./backups}:/backups
      - app_uploads:/uploads:ro
    networks:
      - backend

  # ----------------------------------------------------------------------------
  # 5. Reverse Proxy, TLS Termination & Security Header Enforcement
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: restopass-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      app:
        condition: service_healthy
      backup:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  caddy_logs:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local
