# ==============================================================================
# RestoPass Multi-Tenant Campus & Cafeteria Cloud Production Stack
# High-Scale Architecture (single-instance pilot Distributed Deployment)
# ==============================================================================
# Services:
#   1. postgres: Managed Relational Database with strict constraints & append-only ledger
#   2. redis: Distributed In-Memory Cache for 30s atomic QR token replay prevention
#   3. app: Hardened Node.js Authority & SPA Application
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Primary PostgreSQL 16 Relational Persistence
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: restopass-postgres
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restopass}
      POSTGRES_USER: ${POSTGRES_USER:-restopass_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique strong POSTGRES_PASSWORD in the production .env file}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restopass_app} -d ${POSTGRES_DB:-restopass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 2. Managed Redis 7 In-Memory Cache (Multi-Instance QR Replay Guard)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: restopass-redis
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set a unique strong REDIS_PASSWORD in the production .env file}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 3. RestoPass Cloud Application Node
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: restopass-app
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      RESTOPASS_DEPLOYMENT_MODE: cloud
      PORT: 3000
      # One host-local reverse proxy in front of the loopback-only published port.
      # Change only when the actual trusted proxy topology differs.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PGMAX_CONNECTIONS: 10
      # Relational persistence connection
      DATABASE_URL: postgres://${POSTGRES_USER:-restopass_app}:${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-restopass}
      PGSSLMODE: disable
      # Explicit exception: PostgreSQL is reachable only over this private Docker network.
      ALLOW_INSECURE_DB_TLS: "true"
      # Distributed Redis cache
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set_REDIS_PASSWORD}@redis:6379
      # Production Secrets (Mandatory >= 32 chars)
      SESSION_SECRET: ${SESSION_SECRET:?Set_SESSION_SECRET_minimum_32_random_characters}
      RESTOPASS_MASTER_SECRET: ${RESTOPASS_MASTER_SECRET:?Set_RESTOPASS_MASTER_SECRET_minimum_32_random_characters}
      RESTOPASS_SUPERADMIN_PASSWORD: ${RESTOPASS_SUPERADMIN_PASSWORD:?Set_RESTOPASS_SUPERADMIN_PASSWORD}
      RESTOPASS_RESTAURANT_ADMIN_ACCOUNTS: ${RESTOPASS_RESTAURANT_ADMIN_ACCOUNTS:?Set_tenant_specific_RESTOPASS_RESTAURANT_ADMIN_ACCOUNTS_JSON}
      # S3 / DigitalOcean Spaces / Cloudflare R2 Object Storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - app_uploads:/app/public/uploads
      # Includes private local patron photos under /app/data/private.
      - app_data:/app/data
    networks:
      - data
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local
  app_data:
    driver: local

networks:
  data:
    internal: true
  egress:
    driver: bridge

